[project]
name = "voltaris"
version = "0.1.0"
description = "EV Autonomous NOC — a simulated operations center with a bounded autonomous agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "ollama>=0.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
